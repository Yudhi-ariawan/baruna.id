# Install this file on the public reverse-proxy VM (103.177.176.195) as:
# /etc/nginx/sites-available/baruna.id

upstream baruna_backend {
    server 172.16.105.254:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name baruna.id www.baruna.id;

    # Certbot uses this server while issuing/renewing the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://baruna.id$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baruna.id www.baruna.id;

    ssl_certificate /etc/letsencrypt/live/baruna.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baruna.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BARUNA_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location / {
        proxy_pass http://baruna_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
